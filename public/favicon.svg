<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <circle cx="32" cy="32" r="20" fill="#EA0356" opacity=".35">
    <animate attributeName="r" values="20;32" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".35;0" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="19" fill="#EA0356">
